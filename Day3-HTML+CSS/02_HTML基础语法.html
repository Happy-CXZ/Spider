<!--HTML的注释-->
<!--声明文本类型，主要是描述HTML的版本
    DOCTYPE 后面只有html，表示使用的是HTML5的标准-->
<!DOCTYPE html>
<html lang="en">
<head><!-- 页面的资源配置相关的信息 -->
    <meta charset="UTF-8"> <!-- 页面给到浏览器解释执行的时候用的utf-8 -->
    <title>小卷知道</title><!-- 网站的标题浏览器选项卡上显示的东西 -->
</head>
<body><!-- 用户阅览的内容 -->
    <!-- h1一级标题，文字会变大，变粗，自动换行，
         标题等级到h6 -->
    <h1>我是陈小卷</h1>
    <h2>我是陈小卷</h2>
    <h3>我是陈小卷</h3>
    <h4>我是陈小卷</h4>
    <h5>我是陈小卷</h5>
    <h6>我是陈小卷</h6>

    <!--段落标签 p -->
    <p>小卷美丽又善良</p>
    <p>活泼又可爱</p>

    <!--
    关于文字处理的标签
     <标签 属性="值">被标记的内容</标签>
     -->
    <hr />
    <h1>我是<font color="#dc143c" face="宋体"><i>陈小卷</i></font></h1>
    <!-- 超链接 -->
    <a href="https://www.baidu.com">百度一下</a>
<hr>
    <img src="https://cdn-icons-png.flaticon.com/128/6422/6422200.png" alt="小图标" >
<hr>
    <ul><!-- 无序列表-->
        <li>你爱我</li>
        <li>我爱你</li>
        <li>蜜雪冰城甜蜜蜜</li>
    </ul>
    <ol><!-- 有序列表-->
        <li>你爱我</li>
        <li>我爱你</li>
        <li>蜜雪冰城甜蜜蜜</li>
    </ol>
    <dl><!-- 自定义列表-->
        <dt>城市</dt>
        <dd>北京</dd>
        <dd>上海</dd>
        <dd>深圳</dd>
    </dl>
<hr>
<a href="https://www.baidu.com" target="cxj">百度一下</a>
<a href="https://www.163.com" target="cxj">网易</a>
<!--用这个可以把别人的网站，展示到自己的页面上-->
    <iframe src="https://www.baidu.com" name="cxj"></iframe>


</body>
</html>
